name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go from go.mod
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Test tagged source
        run: go test ./...

      - name: Build release archives
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p dist staging
          build_date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          ldflags="-s -w -X sweepr/internal/buildinfo.Version=${VERSION} -X sweepr/internal/buildinfo.Commit=${COMMIT} -X sweepr/internal/buildinfo.Date=${build_date}"

          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            archive="sweepr_${VERSION}_${os}_${arch}"
            binary="sweepr"
            if [ "${os}" = "windows" ]; then
              binary="sweepr.exe"
            fi

            package_root="staging/sweepr"
            mkdir -p "${package_root}"
            CGO_ENABLED=0 GOOS="${os}" GOARCH="${arch}" \
              go build -trimpath -ldflags "${ldflags}" -o "${package_root}/${binary}" .
            cp LICENSE COPYRIGHT SOURCE.md THIRD_PARTY_NOTICES.md README.md "${package_root}/"
            cp docs/GETTING_STARTED.md "${package_root}/GETTING_STARTED.md"

            if [ "${os}" = "windows" ]; then
              (cd staging && zip -qr "../dist/${archive}.zip" sweepr)
            else
              tar -C staging -czf "dist/${archive}.tar.gz" sweepr
            fi
            rm -r "${package_root}"
          done

          git archive --format=tar.gz --prefix="sweepr-${VERSION}/" \
            -o "dist/sweepr_${VERSION}_source.tar.gz" "${COMMIT}"

          (cd dist && sha256sum sweepr_* > checksums.txt)

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_flags=()
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --verify-tag \
            --generate-notes \
            --title "sweepr ${GITHUB_REF_NAME}" \
            "${release_flags[@]}"
